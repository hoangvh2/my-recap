name: Web secretary

on:
  push:
    paths: &paths
      - "web/**"
      - "functions/**"
      - "tests/**"
      - "scripts/**"
      - "firebase.json"
      - "firestore.rules.tmpl"
      - "infra/**"
      - "firestore.indexes.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit, rules and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json
            tests/package-lock.json
      - uses: actions/setup-java@v4 # the Firestore emulator is a Java program
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm ci --prefix web
          npm ci --prefix functions
          npm ci --prefix tests
      - name: Functions - typecheck, unit tests, build
        run: |
          npm run typecheck --prefix functions
          npm test --prefix functions
          npm run build --prefix functions
      - name: Web - typecheck, unit tests, production build
        env:
          VITE_FIREBASE_API_KEY: ci
          VITE_FIREBASE_PROJECT_ID: ci
          VITE_FIREBASE_APP_ID: ci
        run: |
          npm run typecheck --prefix web
          npm test --prefix web
          npm run build --prefix web
      - name: Production bundle must not contain emulator or test hooks
        run: |
          ! grep -rE "__e2eSignIn|127\.0\.0\.1|9099" web/dist/assets
      - name: Firestore rules tests (emulator)
        env:
          ALLOWED_EMAILS: owner@example.com,wife@example.com
        run: |
          node scripts/configure.mjs
          cd tests && npx firebase emulators:exec --config ../firebase.json --only firestore --project demo-myrecap-rules "npx vitest run rules"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: End-to-end (Auth + Firestore + Functions emulators, fake Gemini)
        run: ./run-e2e.sh
        working-directory: tests
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: |
            tests/e2e/.artifacts
            tests/test-results
          if-no-files-found: ignore

  terraform:
    name: Terraform (format and validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false -input=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
